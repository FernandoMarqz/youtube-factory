[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-factory"
version = "0.1.0"
description = "Local-first YouTube Shorts production pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
youtube-factory = "youtube_factory.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_factory"]
