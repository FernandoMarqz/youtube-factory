id: engineering-es
language: es-ES

content:
  niche: engineering_curiosities
  target_duration_seconds: 35
  min_duration_seconds: 25
  max_duration_seconds: 45

research:
  provider: local
  model: gpt-5.6-luna
  max_sources: 5

script:
  provider: local
  model: gpt-5.6-luna

scene_planning:
  provider: local
  model: gpt-5.6-luna
  min_scenes: 6
  max_scenes: 9
  target_scene_duration_seconds: 4.5

narration:
  provider: openai
  model: gpt-4o-mini-tts
  voice: cedar
  instructions: >
    Habla en español de España con una voz natural, clara y dinámica.
    Empieza el hook con curiosidad y energía inmediata.
    Mantén un ritmo ágil apropiado para un YouTube Short,
    sin sonar apresurado ni como un locutor publicitario.
    Usa pausas breves, enfatiza las palabras clave
    y termina con una conclusión contundente.

visuals:
  provider: local-placeholder
  model: gpt-image-2
  aspect_ratio: "9:16"
  width: 1024
  height: 1536
  style: educational cinematic illustration

publishing:
  enabled: false

render:
  provider: ffmpeg
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  audio_codec: aac
  audio_bitrate: 192k
  pixel_format: yuv420p

visual_motion:
  enabled: true
  zoom_min: 1.0
  zoom_max: 1.07
  pan_max_percent: 0.04
  allowed_motion_types: [slow_zoom_in, slow_zoom_out, pan_left, pan_right, pan_zoom_in, pan_zoom_out, pan_down]
  avoid_adjacent_repeat: true

visual_pacing:
  enabled: true
  max_beats_per_scene: 2
  min_beat_duration_seconds: 2.5
  second_beat_seconds: 6.5
  strongly_prefer_second_beat_seconds: 8.0
  split_ratios: [0.45, 0.50, 0.55]
  preserve_continuity: true

audio:
  narration:
    normalize: true
    target_lufs: -16.0
    true_peak_db: -1.5
  music:
    enabled: true
    mode: catalog
    file_path: null
    catalog_path: assets/music/catalog.yaml
    selection:
      preferred_moods: [curious, modern]
      preferred_energy: medium
      preferred_genres: [electronic, ambient]
      preferred_niches: [engineering, technology, science]
      allow_attribution_required: false
      keyword_profiles:
        futuristic_technology:
          keywords: [espacio, satelite, satelites, planeta, robot, robots, inteligencia artificial, ia, futuro, ordenador, computadora, chip, semiconductor]
          topics: [technology, ai, computing, space, astronomy, robotics, artificial_intelligence]
          moods: [futuristic, curious, modern]
          genres: [electronic, ambient]
          energy: medium
          category: futuristic
        structural_infrastructure:
          keywords: [puente, puentes, estructura, hormigon, acero, edificio, tunel, via, vias, via ferrea, ferrocarril, tren, trenes, traviesa, traviesas, balasto, concreto, viaducto, infraestructura, juntas de dilatacion]
          topics: [engineering, infrastructure, transportation, structures, structural_engineering]
          moods: [technical, curious, modern]
          niches: [engineering, science]
          genres: [electronic, ambient]
          energy: medium
          category: educational
        machinery_energy:
          keywords: [motor, motores, turbina, reactor, maquina, maquinas, velocidad, energia, avion, aviones, explosion, megaconstruccion]
          topics: [machines, engines, energy, transportation, megastructures]
          moods: [powerful, energetic, technological]
          genres: [electronic, rock]
          energy: high
          category: energetic
        general_educational:
          keywords: [por que, como funciona, explicacion, curiosidad]
          topics: [engineering, science, everyday_engineering, curiosities]
          moods: [curious, educational, clean]
          genres: [ambient, electronic]
          energy: low-medium
          fallback: true
    gain_db: -22.0
    loop: true
    fade_in_seconds: 0.6
    fade_out_seconds: 1.2
  ducking:
    enabled: true
    threshold: 0.03
    ratio: 8.0
    attack_ms: 80
    release_ms: 350

captions:
  enabled: true
  alignment:
    provider: local
    model: whisper-1
  grouping:
    max_words_per_cue: 5
    min_cue_duration_seconds: 0.45
    max_cue_duration_seconds: 2.5
    max_characters_per_line: 24
  style:
    font_family: Arial
    font_size: 64
    bold: true
    max_lines: 2
    position: lower-middle
    margin_vertical: 450
    outline_width: 4
    shadow: true
  emphasis:
    enabled: true
    mode: word
    active_color: "#FFD54A"
    inactive_color: "#FFFFFF"
